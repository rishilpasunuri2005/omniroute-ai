services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-omniroute}
      POSTGRES_USER: ${POSTGRES_USER:-omniroute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omniroute}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omniroute} -d ${POSTGRES_DB:-omniroute}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      FRONTEND_ORIGIN: http://localhost:3000
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://omniroute:omniroute@postgres:5432/omniroute}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      CLERK_ISSUER: ${CLERK_ISSUER}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL}
      CLERK_AUDIENCE: ${CLERK_AUDIENCE}
      GROQ_API_KEY: ${GROQ_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      SIMPLE_MODEL: llama-3.1-8b-instant
      BALANCED_MODEL: llama-3.3-70b-versatile
      CODING_MODEL: deepseek/deepseek-coder
      REASONING_MODEL: deepseek/deepseek-r1
      FALLBACK_MODEL: openai/gpt-oss-20b
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
