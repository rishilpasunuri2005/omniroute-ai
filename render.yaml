services:
  - type: web
    name: omniroute-ai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard from Supabase (session pooler string)
      - key: AUTH_REQUIRED
        value: "false"       # no production Clerk instance configured yet; flip to "true" and add CLERK_* vars when ready
      - key: FRONTEND_ORIGIN
        value: https://omniroute-ai.vercel.app
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000,http://127.0.0.1:3000,https://omniroute-ai.vercel.app
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: SENTRY_DSN
        value: ""
      - key: LANGSMITH_API_KEY
        value: ""
      - key: LANGSMITH_PROJECT
        value: omniroute-ai
      - key: OPENROUTER_SITE_URL
        value: https://omniroute-ai.vercel.app
      - key: OPENROUTER_APP_NAME
        value: OmniRoute AI
      - key: SIMPLE_MODEL
        value: llama-3.1-8b-instant
      - key: BALANCED_MODEL
        value: llama-3.3-70b-versatile
      - key: CODING_MODEL
        value: deepseek/deepseek-coder
      - key: REASONING_MODEL
        value: deepseek/deepseek-r1
      - key: FALLBACK_MODEL
        value: google/gemini-2.5-flash
      - key: SIMPLE_PROVIDER
        value: groq
      - key: BALANCED_PROVIDER
        value: groq
      - key: CODING_PROVIDER
        value: openrouter
      - key: REASONING_PROVIDER
        value: openrouter
      - key: FALLBACK_PROVIDER
        value: openrouter
      - key: ROUTE_CONFIDENCE_THRESHOLD
        value: "0.62"
      - key: MAX_RETRIES
        value: "2"
      - key: MAX_REQUEST_BYTES
        value: "512000"
      - key: PER_USER_DAILY_TOKEN_BUDGET
        value: "100000"
    healthCheckPath: /health
